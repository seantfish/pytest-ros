[project]
name = "pytest-ros"
dynamic = ["version"]
description = "A pytest plugin for integration testing of ROS 2 systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Sean Fish", email = "seanfish@gatech.edu" },
]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0.0",
    "rclpy",
    "pyyaml",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[project.optional-dependencies]
dev = [
    "hatch",
    "black",
    "pytest-cov",
]

[project.entry-points."pytest11"]
# This registers the plugin with pytest
pytest_ros = "pytest_ros.plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pytest_ros/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_ros"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"